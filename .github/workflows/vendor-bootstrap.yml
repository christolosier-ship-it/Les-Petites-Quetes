name: Migration locale des mini-jeux

on:
  push:
    branches: [chore/vendor-games-sources]

permissions:
  contents: write

jobs:
  vendor:
    if: startsWith(github.event.head_commit.message, 'chore: bootstrap vendor migration')
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Récupérer Les Petites Quêtes
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Copier les sources amont dans le dépôt
        run: node scripts/vendor-games-bootstrap.mjs

      - name: Restaurer la configuration Vercel normale
        run: git show HEAD^:vercel.json > vercel.json

      - name: Installer les dépendances du projet
        run: npm ci --no-audit --no-fund

      - name: Vérifier la migration et le build complet
        run: npm run check

      - name: Finaliser le commit vendored
        run: |
          rm .github/workflows/vendor-bootstrap.yml
          rm scripts/vendor-games-bootstrap.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: vendor Origin and Beyond Fable sources locally"
          git push origin HEAD:chore/vendor-games-sources
