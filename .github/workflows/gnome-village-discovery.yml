name: Gnome village play asset extraction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  extraction:
    name: Extraire la rampe de jeu Habbo
    if: github.head_ref == 'feat/gnome-village-living-school'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Vérifier si l'asset est déjà présent
        id: already
        run: |
          if [ -f public/worlds/gnome-village/courtyard/play-ramp.png ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer Go
        if: steps.already.outputs.done != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Installer nx
        if: steps.already.outputs.done != 'true'
        run: |
          go install xabbo.io/nx/cmd/nx@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Extraire la rampe
        if: steps.already.outputs.done != 'true'
        env:
          HOTEL: us
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/gnome-play-ramp"
          OUT="$GITHUB_WORKSPACE/public/worlds/gnome-village/courtyard/play-ramp.png"
          mkdir -p "$WORK"
          cd "$WORK"
          nx get furni sb_ramp
          nx extract --images sb_ramp.swf >/dev/null || true
          for dir in 0 2 4 6; do
            rm -f ./*.png
            if nx img furni sb_ramp -d "$dir" >/dev/null 2>&1; then
              render=$(find . -maxdepth 1 -type f -name '*.png' | sort | head -n 1 || true)
              if [ -n "$render" ]; then cp "$render" "$OUT"; break; fi
            fi
          done
          test -f "$OUT"

          python3 - <<'PY'
          import json, os, struct
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'public/worlds/gnome-village'
          manifest = root / 'manifest-lots-2-4.json'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          path = root / 'courtyard/play-ramp.png'
          raw = path.read_bytes()
          width, height = struct.unpack('>II', raw[16:24])
          data['items'] = [item for item in data['items'] if item['file'] != 'courtyard/play-ramp.png']
          data['items'].append({'file': 'courtyard/play-ramp.png', 'source': 'sb_ramp', 'width': width, 'height': height, 'bytes': len(raw)})
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Versionner la rampe
        if: steps.already.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/worlds/gnome-village/courtyard/play-ramp.png public/worlds/gnome-village/manifest-lots-2-4.json
          git commit -m "assets: add Habbo play ramp to gnome courtyard"
          git push origin HEAD:${{ github.head_ref }}
