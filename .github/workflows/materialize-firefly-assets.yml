name: Materialize Firefly assets

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-firefly-assets.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/pwa-local-assets
      - name: Optimiser les assets CC0 en WebP
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y webp
          for name in meadow cottage rustic-house tree-house foliage; do
            cwebp -quiet -q 84 -alpha_q 90 "public/worlds/firefly-forest/${name}.png" -o "public/worlds/firefly-forest/${name}.webp"
          done
          rm public/worlds/firefly-forest/*.png
          file public/worlds/firefly-forest/*
          wc -c public/worlds/firefly-forest/*
      - name: Générer le lockfile npm reproductible
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund
      - name: Committer les fichiers stabilisés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/worlds/firefly-forest package-lock.json
          git commit -m "chore: optimiser les assets locaux et verrouiller npm"
          git push origin HEAD:chore/pwa-local-assets
