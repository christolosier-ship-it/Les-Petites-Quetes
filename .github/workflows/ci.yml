name: Qualité légère

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contrôles essentiels
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund

      - name: Vérifier l’architecture, les cycles et les assets
        run: npm run check:architecture && npm run check:cycles && npm run check:assets

      - name: Vérifier le lint et le typage
        run: npm run lint && npm run typecheck

      - name: Exécuter les tests
        run: npm test

      - name: Vérifier le build de production
        run: npm run build

  gnome-asset-discovery:
    name: Découvrir les assets Habbo structure
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/gnome-village-structure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Installer Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Installer nx
        run: |
          go install xabbo.io/nx/cmd/nx@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Rechercher le lot structure
        env:
          HOTEL: com
        run: |
          set -e
          for query in \
            "tile" "floor" "paving" "wall" "brick" "divider" "corner" \
            "door" "gate" "window" "glass" \
            "bench" "school bench" "fence" "rail"; do
            echo ""
            echo "===== QUERY: $query ====="
            nx furni search "$query" | head -n 15 || true
          done
