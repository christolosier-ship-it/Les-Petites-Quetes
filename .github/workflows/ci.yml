name: Qualité légère

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contrôles essentiels
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund

      - name: Vérifier l’architecture, les cycles et les assets
        run: npm run check:architecture && npm run check:cycles && npm run check:assets

      - name: Vérifier le lint et le typage
        run: npm run lint && npm run typecheck

      - name: Exécuter les tests
        run: npm test

      - name: Vérifier le build de production
        run: npm run build

  gnome-asset-extraction:
    name: Extraire le lot Habbo structure
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/gnome-village-structure'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Vérifier si le lot est déjà présent
        id: already
        run: |
          if [ -f public/worlds/gnome-village/structure/bench-cafeteria.png ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer Go
        if: steps.already.outputs.done != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Installer nx
        if: steps.already.outputs.done != 'true'
        run: |
          go install xabbo.io/nx/cmd/nx@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Télécharger, extraire et rendre les assets
        if: steps.already.outputs.done != 'true'
        env:
          HOTEL: us
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/public/worlds/gnome-village/structure"
          WORK="$RUNNER_TEMP/gnome-habbo"
          mkdir -p "$OUT" "$WORK"

          render_asset() {
            local source="$1"
            local target="$2"
            local dir="${3:-2}"
            local asset_dir="$WORK/$source"
            mkdir -p "$asset_dir"
            cd "$asset_dir"
            echo "::group::Extract $source"
            nx get furni "$source"
            nx extract --images "$source.swf" > extracted-files.txt
            nx img furni "$source" -d "$dir"
            local render
            render=$(find . -maxdepth 1 -type f -name '*.png' | sort | head -n 1 || true)
            if [ -z "$render" ]; then
              render=$(find . -type f -name '*_64_*.png' ! -name '*_icon_*' | sort | head -n 1 || true)
            fi
            if [ -z "$render" ]; then
              echo "Aucun rendu PNG trouvé pour $source" >&2
              exit 1
            fi
            cp "$render" "$OUT/$target"
            echo "source=$source target=$target render=$render"
            echo "::endgroup::"
          }

          render_asset uni_c23_floor floor-classroom.png 2
          render_asset bohogarden_c21_floor floor-courtyard.png 2
          render_asset modern_c17_wall wall-classroom.png 2
          render_asset xmas11_wall wall-cabin.png 2
          render_asset es_fnc_crnr corner-street.png 2
          render_asset vwave_c21_railcrnr corner-railing.png 2
          render_asset xmas12_door door-classroom.png 2
          render_asset window_square window-square.png 2
          render_asset school_bench bench-cafeteria.png 2
          render_asset urban_fence fence-urban.png 2
          render_asset garden_rosefence fence-garden.png 2

          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root = Path('public/worlds/gnome-village/structure')
          sources = {
              'floor-classroom.png': 'uni_c23_floor',
              'floor-courtyard.png': 'bohogarden_c21_floor',
              'wall-classroom.png': 'modern_c17_wall',
              'wall-cabin.png': 'xmas11_wall',
              'corner-street.png': 'es_fnc_crnr',
              'corner-railing.png': 'vwave_c21_railcrnr',
              'door-classroom.png': 'xmas12_door',
              'window-square.png': 'window_square',
              'bench-cafeteria.png': 'school_bench',
              'fence-urban.png': 'urban_fence',
              'fence-garden.png': 'garden_rosefence',
          }
          items = []
          for path in sorted(root.glob('*.png')):
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path} is not PNG')
              width, height = struct.unpack('>II', data[16:24])
              items.append({
                  'file': path.name,
                  'source': sources[path.name],
                  'width': width,
                  'height': height,
                  'bytes': len(data),
              })
          (root / 'manifest.json').write_text(json.dumps({
              'origin': 'Habbo / Sulake',
              'pipeline': 'xabbo nx 0.3.0',
              'usage': 'Les Petites Quêtes — Village des Lutins — lot 1 structure',
              'items': items,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(items, indent=2))
          PY

      - name: Versionner le lot extrait
        if: steps.already.outputs.done != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/worlds/gnome-village/structure
          git commit -m "assets: extract Habbo structure pack for gnome village"
          git push origin HEAD:${{ github.head_ref }}
