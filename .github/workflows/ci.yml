name: Qualité légère

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contrôles essentiels
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Vérifier l’architecture et les cycles
        run: npm run check:architecture && npm run check:cycles

      - name: Vérifier le lint et le typage
        run: npm run lint && npm run typecheck

      - name: Exécuter les tests
        run: npm test

      - name: Vérifier le build de production
        run: npm run build
