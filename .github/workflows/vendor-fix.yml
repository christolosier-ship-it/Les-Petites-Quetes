name: Finaliser la copie locale Beyond Fable

on:
  push:
    branches: [chore/vendor-games-sources]

permissions:
  contents: write

jobs:
  fix-gitlink:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Récupérer Les Petites Quêtes
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Remplacer le gitlink par les vrais fichiers
        run: node scripts/vendor-beyond-fix.mjs

      - name: Restaurer la configuration Vercel normale
        run: git show HEAD^:vercel.json > vercel.json

      - name: Stager la vraie arborescence
        run: git add -A

      - name: Vérifier le mode Git de Beyond Fable
        run: |
          if git ls-files --stage vendor/beyond-fable | grep -q '^160000 '; then
            echo 'Beyond Fable est encore un gitlink' >&2
            exit 1
          fi
          test -f vendor/beyond-fable/src/world/World.ts

      - name: Installer les dépendances du projet
        run: npm ci --no-audit --no-fund

      - name: Vérifier la migration et le build complet
        run: npm run check

      - name: Finaliser le commit
        run: |
          rm .github/workflows/vendor-fix.yml
          rm scripts/vendor-beyond-fix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: replace Beyond Fable gitlink with vendored files"
          git push origin HEAD:chore/vendor-games-sources
