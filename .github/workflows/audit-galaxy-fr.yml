name: Audit Galaxy Explorer FR

on:
  push:
    branches: [feat/galaxy-explorer-fr]
    paths:
      - .github/workflows/audit-galaxy-fr.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/galaxy-explorer-fr
      - name: Extraire les lignes cyrilliques du runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('vendor/galaxy-explorer')
          targets = [root / 'index.html'] + sorted((root / 'src').rglob('*.js'))
          cyr = re.compile(r'[\u0400-\u04FF]')
          records = []
          for path in targets:
              for n, raw in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if not cyr.search(raw):
                      continue
                  stripped = raw.strip()
                  if stripped.startswith('//') or stripped.startswith('*') or stripped.startswith('/*'):
                      continue
                  records.append((str(path), n, stripped))
          Path('GALAXY_FR_AUDIT.txt').write_text(
              '\n'.join(f'{p}\t{line}\t{s}' for p, line, s in records) + '\n',
              encoding='utf-8',
          )
          print(f'{len(records)} lignes runtime contenant du cyrillique recensées.')
      - name: Committer le rapport temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GALAXY_FR_AUDIT.txt
          git commit -m "chore(galaxy-fr): actualiser l’inventaire russe" || exit 0
          git push origin HEAD:feat/galaxy-explorer-fr
