name: Import Galaxy Explorer

# Workflow ponctuel : retiré de la PR une fois le snapshot vendored.
on:
  push:
    branches: [feat/galaxy-explorer-vendor]
    paths:
      - .github/workflows/import-galaxy-explorer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-snapshot:
    name: Copier Galaxy Explorer au commit figé
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer Les Petites Quêtes
        uses: actions/checkout@v5
        with:
          ref: feat/galaxy-explorer-vendor
          fetch-depth: 0

      - name: Récupérer Galaxy Explorer au commit figé
        shell: bash
        run: |
          set -euo pipefail
          upstream=/tmp/galaxy-explorer
          git init "$upstream"
          git -C "$upstream" remote add origin https://github.com/syakubson/procedural-galaxy.git
          git -C "$upstream" fetch --depth=1 origin 03cbf44dca9b0e8b864d0f11ff613f72689f7c0d
          git -C "$upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$upstream" rev-parse HEAD)" = "03cbf44dca9b0e8b864d0f11ff613f72689f7c0d"

      - name: Copier le snapshot source complet
        shell: bash
        run: |
          set -euo pipefail
          upstream=/tmp/galaxy-explorer
          target=vendor/galaxy-explorer
          rm -rf "$target"
          mkdir -p "$target"
          git -C "$upstream" archive HEAD | tar -x -C "$target"
          cat > "$target/LPQ_UPSTREAM.md" <<'EOF'
          # Galaxy Explorer — snapshot amont

          Dépôt source : `syakubson/procedural-galaxy`

          Commit figé : `03cbf44dca9b0e8b864d0f11ff613f72689f7c0d`

          Le dossier contient une copie physique du snapshot Git amont à ce commit. Les fichiers servis par Les Petites Quêtes sont matérialisés localement par `scripts/materialize-galaxy-explorer.mjs` ; aucun téléchargement réseau de l'amont n'est requis au runtime ni au build normal.
          EOF
          test -f "$target/index.html"
          test -f "$target/src/main.js"
          test -f "$target/vendor/three.module.js"
          test -f "$target/audio/tracks/frozen_star.mp3"
          test -f "$target/media/hero/alliance_flagship.webp"

      - name: Valider et matérialiser le runtime
        run: node scripts/materialize-galaxy-explorer.mjs

      - name: Enregistrer le snapshot dans la branche
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/galaxy-explorer
          if git diff --cached --quiet; then
            echo "Le snapshot Galaxy Explorer exact est déjà présent."
            exit 0
          fi
          git commit -m "vendor(galaxy): embarquer Galaxy Explorer 0.9.4"
          git push origin HEAD:feat/galaxy-explorer-vendor
