name: Gnome asset discovery

on:
  push:
    branches:
      - feat/gnome-village-structure
    paths:
      - .github/workflows/gnome-asset-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install nx
        run: |
          go install xabbo.io/nx/cmd/nx@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Search structural furni
        env:
          HOTEL: fr
        run: |
          set -e
          for query in \
            "school floor" \
            "floor tile" \
            "school wall" \
            "brick wall" \
            "corner" \
            "school door" \
            "door" \
            "school window" \
            "window" \
            "school bench" \
            "bench" \
            "school fence" \
            "fence"; do
            echo ""
            echo "===== QUERY: $query ====="
            nx furni search "$query" | head -n 12 || true
          done
